<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>De ellos para ellas</title>
    <!-- SPA redirect for GitHub Pages (spa-github-pages pattern).
         pathSegmentsToKeep = 1 keeps the repo name (project pages: /<repo>/...).
         Set it to 0 if the site is served from a custom domain root. -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
